---
# Backup tenant-specific (non-shared) data into <backup_dir>.tar.gz
# Runs with the CPU/IO priority of the caller (`backup_site` lowers it to nice 19 + idle IO class).
# Params:
#   - tenant_dir
#   - tenant_db
#   - backup_dir
#   - include_private (default true): also back up etc/config.json (credentials) and logs
#   - include_readme (default false)

- name: Create backup directory
  ansible.builtin.file:
      path: "{{ backup_dir }}"
      state: directory
      mode: "0700"
  tags: ["backup", "periodic"]

# consistent InnoDB snapshot, without locking the site's tables while dumping
- name: Dump tenant database
  community.mysql.mysql_db:
      name: "{{ tenant_db }}"
      state: dump
      target: "{{ backup_dir }}/database.sql"
      single_transaction: true
      quick: true
      login_unix_socket: /var/run/mysqld/mysqld.sock
  tags: ["backup", "periodic"]

- name: Render export README into backup
  ansible.builtin.template:
      src: "{{ playbook_dir }}/files/README_EXPORT.md"
      dest: "{{ backup_dir }}/README.md"
      mode: "0644"
  when: include_readme | default(false) | bool
  tags: ["backup", "periodic"]

# streams the tenant's files + the dump into the archive, no intermediate copy of the files
- name: Archive tenant files and database
  ansible.builtin.command:
      argv:
          - /bin/bash
          - "{{ playbook_dir }}/files/backup_tenant.sh"
          - "{{ tenant_dir }}"
          - "{{ backup_dir }}"
          - "{{ '1' if include_private | default(true) | bool else '0' }}"
  changed_when: true
  tags: ["backup", "periodic"]

- name: Remove uncompressed backup directory
  ansible.builtin.file:
      path: "{{ backup_dir }}"
      state: absent
  tags: ["backup", "periodic"]
